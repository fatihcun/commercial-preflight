<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Commercial Preflight</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <svg class="icon-definitions" aria-hidden="true">
      <symbol id="icon-inbox" viewBox="0 0 24 24"><path d="M4 5h16v13H4zM4 14h4l2 2h4l2-2h4" /></symbol>
      <symbol id="icon-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v6M12 17h.01" /></symbol>
      <symbol id="icon-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h5M9 13h6M9 17h6" /></symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></symbol>
      <symbol id="icon-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h8M16 18h4" /><circle cx="16" cy="6" r="2" /><circle cx="8" cy="12" r="2" /><circle cx="14" cy="18" r="2" /></symbol>
      <symbol id="icon-layout" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1" /><path d="M9 4v16M9 10h12" /></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="m8 12 3 3 5-6" /></symbol>

    </svg>
    <div class="app-shell">
      <aside class="sidebar" data-i18n-aria-label="nav.primary">
        <div class="product-lockup"><img src="/app-mark.png" alt="" /><span>Commercial<br />Preflight</span></div>
        <nav class="primary-nav">
          <button class="nav-item is-active" data-page="order-inbox" type="button"><svg aria-hidden="true"><use href="#icon-inbox" /></svg><span data-i18n="nav.orderInbox"></span></button>
          <button class="nav-item" data-page="exceptions" type="button"><svg aria-hidden="true"><use href="#icon-alert" /></svg><span data-i18n="nav.exceptions"></span></button>
          <button class="nav-item" data-page="quotes" type="button"><svg aria-hidden="true"><use href="#icon-file" /></svg><span data-i18n="nav.quotes"></span></button>
          <button class="nav-item" data-page="history" type="button"><svg aria-hidden="true"><use href="#icon-clock" /></svg><span data-i18n="nav.history"></span></button>
          <div class="nav-separator"></div>
          <button class="nav-item" data-page="policies" type="button"><svg aria-hidden="true"><use href="#icon-sliders" /></svg><span data-i18n="nav.policies"></span></button>
          <button class="nav-item" data-page="templates" type="button"><svg aria-hidden="true"><use href="#icon-layout" /></svg><span data-i18n="nav.templates"></span></button>
          <div class="nav-separator"></div>
          <span class="nav-label" data-i18n="nav.tools"></span>
          <button class="nav-item" data-page="quick-check" type="button"><svg aria-hidden="true"><use href="#icon-check" /></svg><span data-i18n="nav.proposalCheck"></span></button>
          <button class="nav-item settings-nav" data-page="settings" type="button"><svg aria-hidden="true"><use href="#icon-settings" /></svg><span data-i18n="nav.settings"></span></button>
        </nav>
        <div class="sidebar-status"><span class="local-marker" aria-hidden="true"></span><div><strong data-i18n="sidebar.localOnly"></strong><span data-i18n="sidebar.shadowMode"></span></div></div>
      </aside>
      <div class="application">
        <header class="topbar"><div><strong id="top-page-title"></strong><span><span id="top-company"></span><span class="context-separator" aria-hidden="true"> · </span><span id="top-policy"></span></span></div></header>
        <main id="main-content">
          <section class="page" id="order-inbox-page">
            <div class="page-heading"><div><h1 data-i18n="nav.orderInbox"></h1><p data-i18n="page.orderInbox.description"></p></div><button class="button button-primary" id="add-order-button" type="button" data-i18n="button.addOrder"></button></div>
            <div class="table-wrap operational-table"><table><thead><tr><th data-i18n="table.received"></th><th data-i18n="table.customerPo"></th><th data-i18n="table.quote"></th><th data-i18n="table.result"></th><th data-i18n="table.status"></th></tr></thead><tbody id="order-inbox-body"></tbody></table><div class="empty-state" id="order-inbox-empty" role="status"><strong data-i18n="empty.orders"></strong><span data-i18n="empty.ordersHint"></span></div></div>
          </section>
          <section class="page" id="exceptions-page" hidden>
            <div class="page-heading"><div><h1 data-i18n="nav.exceptions"></h1><p data-i18n="page.exceptions.description"></p></div></div>
            <div class="table-wrap operational-table"><table><thead><tr><th data-i18n="table.date"></th><th data-i18n="table.customer"></th><th data-i18n="table.po"></th><th data-i18n="table.quote"></th><th data-i18n="table.difference"></th><th data-i18n="table.status"></th></tr></thead><tbody id="exceptions-body"></tbody></table><div class="empty-state" id="exceptions-empty" hidden role="status"><strong data-i18n="empty.exceptions"></strong><span data-i18n="empty.exceptionsHint"></span></div></div>
          </section>
          <section class="page" id="quotes-page" hidden>
            <div class="page-heading"><div><h1 data-i18n="nav.quotes"></h1><p data-i18n="page.quotes.description"></p></div><button class="button button-primary" id="add-quote-button" type="button" data-i18n="button.addQuote"></button></div>
            <p class="form-message" id="quote-import-message"></p>
            <div class="table-wrap operational-table"><table><thead><tr><th data-i18n="table.quoteNumber"></th><th data-i18n="table.revision"></th><th data-i18n="table.customer"></th><th data-i18n="table.date"></th><th data-i18n="table.currency"></th><th data-i18n="table.total"></th><th data-i18n="table.status"></th><th data-i18n="table.source"></th><th></th></tr></thead><tbody id="quotes-body"></tbody></table><div class="empty-state" id="quotes-empty" role="status"><strong data-i18n="empty.quotes"></strong><span data-i18n="empty.quotesHint"></span></div></div>
          </section>
          <section class="page" id="order-review-page" hidden>
            <button class="back-link" id="order-review-back" type="button" data-i18n="review.backInbox"></button>
            <div class="page-heading result-heading"><div><p class="section-kicker" data-i18n="review.kicker"></p><h1 id="review-order-number"></h1><p id="review-customer"></p></div><div class="result-verdict"><strong id="review-status"></strong><span id="review-difference-count"></span></div></div>
            <dl class="transaction-summary"><div><dt data-i18n="table.customer"></dt><dd id="review-summary-customer">—</dd></div><div><dt data-i18n="review.poNumber"></dt><dd id="review-summary-po">—</dd></div><div><dt data-i18n="review.matchedQuote"></dt><dd id="review-summary-quote">—</dd></div></dl>
            <section class="association-panel" id="association-panel" hidden><div><strong data-i18n="review.associationRequired"></strong><p data-i18n="review.associationHelp"></p></div><select id="association-quote"></select><button class="button button-secondary" id="associate-quote-button" type="button" data-i18n="button.selectQuote"></button></section>
            <div class="table-wrap comparison-table"><table><thead><tr><th data-i18n="table.fieldItem"></th><th data-i18n="table.quote"></th><th data-i18n="table.customerOrder"></th><th data-i18n="table.result"></th></tr></thead><tbody id="comparison-body"></tbody></table><div class="empty-state" id="comparison-empty" hidden role="status"><strong data-i18n="empty.differences"></strong><span data-i18n="empty.differencesHint"></span></div></div>
            <div class="button-row review-actions"><button class="button button-primary" id="mark-reviewed-button" type="button" data-i18n="button.markReviewed"></button><button class="button button-secondary" id="open-quote-button" type="button" data-i18n="button.openQuote"></button><button class="button button-secondary" id="open-order-button" type="button" data-i18n="button.openOrder"></button></div><p class="form-message" id="review-message"></p>
          </section>
          <section class="page" id="quick-check-page" hidden>
            <div class="page-heading"><div><h1 data-i18n="nav.proposalCheck"></h1><p data-i18n="page.proposalCheck.description"></p></div></div>
            <section class="configuration-panel" aria-labelledby="active-configuration-title"><h2 id="active-configuration-title" data-i18n="proposal.activeConfiguration"></h2><dl class="configuration-grid"><div><dt data-i18n="proposal.company"></dt><dd id="quick-company">—</dd></div><div><dt data-i18n="proposal.policy"></dt><dd id="quick-policy">—</dd></div><div><dt data-i18n="proposal.template"></dt><dd id="quick-template">—</dd></div></dl></section>
            <section class="drop-zone" id="drop-zone" tabindex="0" role="button" data-i18n-aria-label="proposal.dropAria"><div class="document-mark" aria-hidden="true"><svg><use href="#icon-file" /></svg></div><div><h2 data-i18n="proposal.dropHere"></h2><p>XLSX · PDF</p></div><button class="button button-primary" id="choose-file-button" type="button" data-i18n="button.selectProposal"></button></section>
            <section class="last-check" aria-labelledby="last-check-title"><div><h2 id="last-check-title" data-i18n="proposal.lastCheck"></h2><p id="last-check-empty" data-i18n="empty.proposals"></p></div><div class="last-check-data" id="last-check-data" hidden><strong id="last-file"></strong><span id="last-meta"></span></div><span class="status-text" id="last-verdict" hidden></span></section>
          </section>
          <section class="page state-page" id="checking-page" hidden aria-live="polite"><div class="progress-line"><span></span></div><p class="section-kicker" data-i18n="proposal.review"></p><h1 data-i18n="proposal.checking"></h1><p id="checking-file" data-i18n="proposal.applyingPolicy"></p></section>
          <section class="page" id="outcome-page" hidden>
            <button class="back-link" id="outcome-back" type="button" data-i18n="proposal.backCheck"></button>
            <div class="page-heading result-heading"><div><p class="section-kicker" data-i18n="proposal.review"></p><h1 id="outcome-file" data-i18n="proposal.proposal"></h1></div><div class="result-verdict"><strong id="outcome-verdict"></strong><span id="outcome-finding-count"></span></div></div>
            <div class="result-summary"><dl><div><dt data-i18n="proposal.checksCompleted"></dt><dd id="outcome-checks">—</dd></div><div><dt data-i18n="proposal.notApplicable"></dt><dd id="outcome-na">—</dd></div><div><dt data-i18n="proposal.policy"></dt><dd id="outcome-policy">—</dd></div><div><dt data-i18n="proposal.template"></dt><dd id="outcome-template">—</dd></div></dl><p class="result-note" id="outcome-note"></p></div>
            <div class="button-row"><button class="button button-primary" id="view-findings-button" type="button" data-i18n="button.viewFindings"></button><button class="button button-secondary" id="check-another-button" type="button" data-i18n="button.checkAnother"></button></div><p class="mode-line" data-i18n="proposal.modeShadow"></p>
          </section>
          <section class="page" id="findings-page" hidden>
            <button class="back-link" id="findings-back" type="button" data-i18n="proposal.backSummary"></button>
            <div class="page-heading findings-heading"><div><p class="section-kicker" data-i18n="proposal.findings"></p><h1 id="findings-file" data-i18n="proposal.proposal"></h1><p id="findings-summary"></p></div><button class="button button-secondary" id="findings-check-another" type="button" data-i18n="button.checkAnother"></button></div><div class="findings-list" id="findings-list"></div>
          </section>
          <section class="page" id="history-page" hidden>
            <div class="page-heading"><div><h1 data-i18n="nav.history"></h1><p data-i18n="page.history.description"></p></div></div>
            <section class="management-strip" data-i18n-aria-label="history.managementTotals"><div><span data-i18n="history.totalChecked"></span><strong id="aggregate-total">0</strong></div><div><span data-i18n="history.pass"></span><strong class="tone-pass" id="aggregate-pass">0</strong></div><div><span data-i18n="history.review"></span><strong class="tone-review" id="aggregate-review">0</strong></div><div><span data-i18n="history.critical"></span><strong class="tone-critical" id="aggregate-critical">0</strong></div><div><span data-i18n="history.incomplete"></span><strong id="aggregate-incomplete">0</strong></div></section>
            <form class="filter-bar" id="history-filter-form"><label><span data-i18n="history.verdict"></span><select id="history-verdict"><option value="" data-i18n="history.all"></option><option value="PASS" data-i18n="status.PASS"></option><option value="REVIEW" data-i18n="status.REVIEW"></option><option value="CRITICAL" data-i18n="status.CRITICAL"></option><option value="INCOMPLETE" data-i18n="status.INCOMPLETE"></option></select></label><label><span data-i18n="history.format"></span><select id="history-format"><option value="" data-i18n="history.all"></option><option>XLSX</option><option>PDF</option></select></label><label><span data-i18n="history.from"></span><input id="history-from" type="date" /></label><label><span data-i18n="history.to"></span><input id="history-to" type="date" /></label><button class="button button-secondary" type="submit" data-i18n="button.apply"></button></form>
            <div class="table-wrap"><table><thead><tr><th data-i18n="table.date"></th><th data-i18n="history.proposal"></th><th data-i18n="history.format"></th><th data-i18n="history.verdict"></th><th data-i18n="history.findings"></th><th data-i18n="proposal.policy"></th></tr></thead><tbody id="history-body"></tbody></table><div class="empty-state" id="history-empty" hidden role="status"><strong data-i18n="empty.history"></strong><span data-i18n="empty.historyHint"></span></div></div>
            <section class="exception-summary"><h2 data-i18n="history.commonExceptions"></h2><div id="rule-aggregates"><p class="muted" data-i18n="empty.findings"></p></div></section>
          </section>
          <section class="page" id="policies-page" hidden><div class="page-heading"><div><h1 data-i18n="nav.policies"></h1><p data-i18n="page.policies.description"></p></div><button class="button button-primary" id="new-policy-button" type="button" data-i18n="button.newPolicy"></button></div><div id="policy-list"></div></section>
          <section class="page" id="templates-page" hidden><div class="page-heading"><div><h1 data-i18n="page.templates.title"></h1><p data-i18n="page.templates.description"></p></div><button class="button button-primary" id="new-template-button" type="button" data-i18n="button.newTemplate"></button></div><div id="template-list"></div></section>
          <section class="page" id="settings-page" hidden>
            <div class="page-heading"><div><h1 data-i18n="nav.settings"></h1><p data-i18n="page.settings.description"></p></div></div>
            <div class="settings-layout"><nav class="settings-tabs" data-i18n-aria-label="settings.sections"><button class="is-active" data-settings="company" type="button" data-i18n="settings.company"></button><button data-settings="application" type="button" data-i18n="settings.application"></button><button data-settings="privacy" type="button" data-i18n="settings.privacy"></button><button data-settings="about" type="button" data-i18n="settings.about"></button></nav>
              <div class="settings-content">
                <section id="settings-company"><h2 data-i18n="settings.company"></h2><form class="form-stack" id="company-form"><label><span><span data-i18n="settings.companyName"></span><span class="required"> *</span></span><input id="settings-company-name" required maxlength="120" /></label><label><span><span data-i18n="settings.defaultCurrency"></span><span class="required"> *</span></span><select id="settings-currency" required></select></label><div><button class="button button-primary" type="submit" data-i18n="button.saveCompany"></button></div><p class="form-message" id="company-message"></p></form></section>
                <section id="settings-application" hidden><h2 data-i18n="settings.application"></h2><label class="language-setting"><span data-i18n="language.label"></span><select id="settings-language" class="language-select"><option value="tr">Türkçe</option><option value="en">English</option></select></label><label class="setting-row"><span><strong data-i18n="settings.startWindows"></strong><small data-i18n="settings.startWindowsHelp"></small></span><input class="switch" id="autostart-toggle" type="checkbox" /></label><p class="form-message" id="autostart-message"></p><div class="information-row"><span data-i18n="settings.currentMode"></span><strong data-i18n="settings.shadow"></strong></div><h3 data-i18n="settings.folderIntake"></h3><p data-i18n="settings.folderHelp"></p><div class="folder-setting"><label><span data-i18n="settings.quoteFolder"></span><input id="quote-intake-folder" readonly /></label><button class="button button-secondary" id="choose-quote-folder" type="button" data-i18n="button.choose"></button></div><div class="folder-setting"><label><span data-i18n="settings.orderFolder"></span><input id="order-intake-folder" readonly /></label><button class="button button-secondary" id="choose-order-folder" type="button" data-i18n="button.choose"></button></div><div class="button-row"><button class="button button-primary" id="save-intake-folders" type="button" data-i18n="button.saveFolders"></button></div><p class="form-message" id="intake-folder-message"></p></section>
                <section id="settings-privacy" hidden><h2 data-i18n="settings.privacy"></h2><p data-i18n="settings.privacyDescription"></p><div class="information-row database-row"><span data-i18n="settings.databaseLocation"></span><code id="database-location">—</code></div><div class="danger-row"><div><strong data-i18n="settings.clearTitle"></strong><p data-i18n="settings.clearDescription"></p></div><button class="button button-danger" id="clear-history-button" type="button" data-i18n="button.clearHistory"></button></div></section>
                <section id="settings-about" hidden><h2 data-i18n="settings.about"></h2><div class="about-product"><img src="/app-mark.png" alt="" /><div><strong>Commercial Preflight</strong><p data-i18n="settings.version"></p></div></div><p data-i18n="settings.aboutDescription"></p></section>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
    <dialog class="onboarding-dialog" id="onboarding-dialog"><form id="onboarding-form">
      <header><div class="onboarding-brand"><strong>Commercial Preflight</strong><span data-i18n="onboarding.initialSetup"></span></div><label class="onboarding-language"><span data-i18n="language.label"></span><select id="onboarding-language" class="language-select"><option value="tr">Türkçe</option><option value="en">English</option></select></label></header>
      <ol class="onboarding-progress"><li data-progress-step="1"><span>1</span><strong data-i18n="onboarding.step1.label"></strong></li><li data-progress-step="2"><span>2</span><strong data-i18n="onboarding.step2.label"></strong></li><li data-progress-step="3"><span>3</span><strong data-i18n="onboarding.step3.label"></strong></li></ol>
      <section class="onboarding-step" data-step="1"><p class="section-kicker" data-i18n="onboarding.step1.kicker"></p><h1 data-i18n="onboarding.step1.title"></h1><p data-i18n="onboarding.step1.description"></p><div class="onboarding-fields"><label><span><span data-i18n="settings.companyName"></span><span class="required"> *</span></span><input id="onboarding-company" required maxlength="120" autocomplete="organization" /></label><label><span><span data-i18n="settings.defaultCurrency"></span><span class="required"> *</span></span><select id="onboarding-currency" required></select></label></div></section>
      <section class="onboarding-step" data-step="2" hidden><p class="section-kicker" data-i18n="onboarding.step2.kicker"></p><h1 data-i18n="onboarding.step2.title"></h1><p data-i18n="onboarding.step2.description"></p><fieldset class="policy-group"><legend data-i18n="onboarding.step2.limits"></legend><div class="form-grid"><label><span><span data-i18n="policy.maximumDiscount"></span><span class="required"> *</span></span><div class="input-suffix"><input id="onboarding-discount" type="number" min="0" max="100" step="0.1" required /><span>%</span></div></label><label><span><span data-i18n="policy.maximumPayment"></span><span class="required"> *</span></span><input id="onboarding-payment" type="number" min="1" required /></label><label><span data-i18n="policy.minimumMargin"></span><div class="input-suffix"><input id="onboarding-margin" type="number" min="0" max="100" step="0.1" /><span>%</span></div></label><label><span><span data-i18n="policy.quoteValidity"></span><span class="required"> *</span></span><input id="onboarding-validity" type="number" min="1" required /></label></div></fieldset><fieldset class="policy-group"><legend data-i18n="onboarding.step2.controls"></legend><div class="control-grid" id="onboarding-controls"></div></fieldset></section>
      <section class="onboarding-step" data-step="3" hidden><p class="section-kicker" data-i18n="onboarding.step3.kicker"></p><h1 data-i18n="onboarding.step3.title"></h1><p data-i18n="onboarding.step3.description"></p><dl class="review-list" id="onboarding-review"></dl></section>
      <p class="form-error" id="onboarding-error" aria-live="polite"></p><footer><button class="button button-secondary" id="onboarding-back" type="button" hidden data-i18n="button.back"></button><button class="button button-primary" id="onboarding-next" type="submit" data-i18n="button.next"></button></footer>
    </form></dialog>
    <dialog class="editor-dialog" id="policy-dialog"><form id="policy-form"><header><div><p class="section-kicker" data-i18n="policy.profile"></p><h2 id="policy-dialog-title" data-i18n="policy.edit"></h2></div><button class="dialog-close" type="button" data-close="policy-dialog" data-i18n-aria-label="button.close">×</button></header><div class="dialog-body"><label><span data-i18n="policy.name"></span><input id="policy-name-input" required maxlength="120" /></label><div class="form-grid"><label><span data-i18n="policy.maximumDiscountPercent"></span><input id="policy-discount-input" type="number" min="0" max="100" step="0.1" required /></label><label><span data-i18n="policy.maximumPaymentDays"></span><input id="policy-payment-input" type="number" min="1" required /></label><label><span data-i18n="policy.minimumMarginPercent"></span><input id="policy-margin-input" type="number" min="0" max="100" step="0.1" /></label><label><span data-i18n="policy.quoteValidityDays"></span><input id="policy-validity-input" type="number" min="1" required /></label><label><span data-i18n="policy.discountViolation"></span><select id="policy-discount-severity"><option value="REVIEW" data-i18n="history.review"></option><option value="CRITICAL" data-i18n="history.critical"></option></select></label><label><span data-i18n="policy.paymentViolation"></span><select id="policy-payment-severity"><option value="REVIEW" data-i18n="history.review"></option><option value="CRITICAL" data-i18n="history.critical"></option></select></label></div><h3 data-i18n="policy.controls"></h3><div class="control-grid" id="policy-controls"></div><p class="form-error" id="policy-error"></p></div><footer><button class="button button-secondary" type="button" data-close="policy-dialog" data-i18n="button.cancel"></button><button class="button button-primary" type="submit" data-i18n="button.savePolicy"></button></footer></form></dialog>
    <dialog class="editor-dialog template-dialog" id="template-dialog"><form id="template-form"><header><div><p class="section-kicker" data-i18n="template.profile"></p><h2 id="template-dialog-title" data-i18n="template.edit"></h2></div><button class="dialog-close" type="button" data-close="template-dialog" data-i18n-aria-label="button.close">×</button></header><div class="dialog-body"><label><span data-i18n="template.name"></span><input id="template-name-input" required maxlength="120" /></label><p class="field-help" data-i18n="template.help"></p><div class="alias-grid" id="alias-editor"></div><p class="form-error" id="template-error"></p></div><footer><button class="button button-secondary" type="button" data-close="template-dialog" data-i18n="button.cancel"></button><button class="button button-primary" type="submit" data-i18n="button.saveTemplate"></button></footer></form></dialog>
