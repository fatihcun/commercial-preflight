[package]
name = "commercial-preflight-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "commercial_preflight_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "commercial-preflight"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
commercial-preflight-core = { path = "../../../crates/core" }
commercial-preflight-engine = { path = "../../../crates/engine" }
commercial-preflight-intake = { path = "../../../crates/intake" }
commercial-preflight-policy = { path = "../../../crates/policy" }
commercial-preflight-reconciliation = { path = "../../../crates/reconciliation" }
commercial-preflight-storage = { path = "../../../crates/storage" }
serde.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.3"

[dev-dependencies]
serde_json = "1.0.149"
